# --- Functional roles -----------------------------------------------------

retinal:
  name: "Retinal cofactor (type II opsin color)"
  hex: "#bc6c25"
  rgb_norm: [0.737, 0.424, 0.145]
  source: "molecules.retinal"

theozyme:
  name: "Theozyme residues (Ser, His, Asp)"
  hex: "#6a994e"
  rgb_norm: [0.416, 0.600, 0.306]
  source: "functional.conserved / spectral_lambda.530"

substrate:
  name: "Substrate (succinyl-AAPR)"
  hex: "#d4a03c"
  rgb_norm: [0.831, 0.627, 0.235]
  source: "spectral_lambda.570"

candidate_region:
  name: "GRN candidate region (Step 3)"
  hex: "#457b6b"
  rgb_norm: [0.271, 0.482, 0.420]
  source: "spectral_lambda.490"

candidate_region_light:
  name: "GRN candidate region surface"
  hex: "#a3c4b8"
  rgb_norm: [0.639, 0.769, 0.722]
  source: "sequences.short_wave_light"

# --- Geometry / annotation ------------------------------------------------

geometry:
  name: "Theozyme geometry (triangle, vectors, Cα spheres)"
  hex: "#343a40"
  rgb_norm: [0.204, 0.227, 0.251]
  source: "neutral.dark_gray"

hbond:
  name: "H-bonds, dashed distance lines"
  hex: "#6c757d"
  rgb_norm: [0.424, 0.459, 0.490]
  source: "neutral.gray"

# --- Text / axes ----------------------------------------------------------

label:
  name: "Labels, annotations, axes, ticks"
  hex: "#343a40"
  rgb_norm: [0.204, 0.227, 0.251]
  source: "figure_elements.annotation"

# --- Sequence alignment (Fig 5.5) -----------------------------------------

seq_identity:
  name: "Identical positions (WT = designed)"
  hex: "#adb5bd"
  rgb_norm: [0.678, 0.710, 0.741]
  source: "neutral.light_gray"

seq_mutation:
  name: "Mutated positions (designed != WT)"
  hex: "#c1666b"
  rgb_norm: [0.757, 0.400, 0.420]
  source: "structures.type_ii"

# --- Region markers (Fig 5.5 alignment) -----------------------------------

region_tm:
  name: "TM helix region markers"
  hex: "#3d5a80"
  rgb_norm: [0.239, 0.353, 0.502]
  source: "structures.type_i"

region_icl:
  name: "ICL region markers"
  hex: "#457b6b"
  rgb_norm: [0.271, 0.482, 0.420]
  source: "sequences.short_wave"

# --- pLDDT plot (Fig 5.6C) ------------------------------------------------

plddt_threshold:
  name: "Confidence threshold line"
  hex: "#343a40"
  rgb_norm: [0.204, 0.227, 0.251]
  style: "dashed"
  source: "neutral.dark_gray"
