  source: "continuous.spectral_lambda.400"

tm2:
  name: "TM2"
  hex: "#3d5a80"
  rgb_norm: [0.239, 0.353, 0.502]
  source: "continuous.spectral_lambda.450"

tm3:
  name: "TM3"
  hex: "#457b6b"
  rgb_norm: [0.271, 0.482, 0.420]
  source: "continuous.spectral_lambda.490"

tm4:
  name: "TM4"
  hex: "#6a994e"
  rgb_norm: [0.416, 0.600, 0.306]
  source: "continuous.spectral_lambda.530"

tm5:
  name: "TM5"
  hex: "#d4a03c"
  rgb_norm: [0.831, 0.627, 0.235]
