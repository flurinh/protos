# Rhodozyme Figure Colors
# ===========================================================================
# Single source of truth for all Ch5 figures (PyMOL + matplotlib).
# Consistent with fig 4.2 spectral TM helix colors.
#
# Convention:
#   gray = experimental / crystal structure / locked
#   color = highlighted element or model-generated
#
# Python usage:
#   import yaml
#   with open("rhodozyme_colors.yaml") as f:
#       C = yaml.safe_load(f)
#
# PyMOL usage:
#   @rhodozyme_colors.pml
#
# Parent palette: thesis/colorscales.yaml (Scientific Elegance)
# Spectral TM colors: continuous.spectral_lambda
# ===========================================================================

# --- Backbone / experimental structures (gray hues) -----------------------

backbone:
  name: "Backbone (experimental structure)"
  hex: "#adb5bd"
  rgb_norm: [0.678, 0.710, 0.741]
  source: "figure_elements.backbone_unfocused"

backbone_dark:
  name: "Backbone variant (darker gray, e.g. dark-state overlay)"
  hex: "#6c757d"
  rgb_norm: [0.424, 0.459, 0.490]
  source: "neutral.gray"

backbone_faint:
  name: "Backbone variant (very faded context)"
  hex: "#e9ecef"
  rgb_norm: [0.914, 0.926, 0.937]
  source: "figure_elements.grid"

# --- Designed backbone (model output, Steps 4-6) -------------------------

designed:
  name: "Designed backbone (model output)"
  hex: "#c1666b"
  rgb_norm: [0.757, 0.400, 0.420]
  source: "structures.type_ii / spectral_lambda.620"

designed_light:
  name: "Designed backbone variant (multi-design overlay)"
  hex: "#e4c1c1"
  rgb_norm: [0.894, 0.757, 0.757]
  source: "structures.type_ii_light"

# --- TM helix spectral colors (from fig 4.2) -----------------------------
# Used to highlight specific helices (e.g. TM5/TM6 displacement in Fig 5.1)

