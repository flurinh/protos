# Thesis Color Scales - Unified Scheme
# =============================================================================
# Design Principles:
#   - Structures/Graphs: Blue/Red for protein families (Type I/II)
#   - Sequences/Embeddings: Teal/Gold for gene types (distinct from structures)
#   - Molecules: Orange/Purple for ligands
#   - No rainbow - controlled, consistent palette
# =============================================================================

# =============================================================================
# STRUCTURES - Protein Families (Blue/Red palette)
# Used for: Structure comparisons, Graph analysis, GRN, PyMOL
# =============================================================================
structures:
  # Type I (Microbial Rhodopsins) - Blue family
  type_i:
    name: "Type I (Microbial)"
    hex: "#1f77b4"
    rgb: [31, 119, 180]
    rgb_norm: [0.122, 0.467, 0.706]

  1C3W:
    name: "Bacteriorhodopsin"
    type: "type_i"
    hex: "#1f77b4"
    rgb_norm: [0.122, 0.467, 0.706]

  3UG9:
    name: "Channelrhodopsin"
    type: "type_i"
    hex: "#aec7e8"
    rgb_norm: [0.682, 0.780, 0.910]

  # Type II (Animal Opsins) - Red family
  type_ii:
    name: "Type II (Animal)"
    hex: "#d62728"
    rgb: [214, 39, 40]
    rgb_norm: [0.839, 0.153, 0.157]

  1U19:
    name: "Bovine Rhodopsin"
    type: "type_ii"
    hex: "#d62728"
    rgb_norm: [0.839, 0.153, 0.157]

  2Z73:
    name: "Squid Rhodopsin"
    type: "type_ii"
    hex: "#ff9896"
    rgb_norm: [1.0, 0.596, 0.588]

# =============================================================================
# SEQUENCES - Gene Types (Teal/Gold palette)
# Used for: Sequence analysis, Phylogenetic trees, Embeddings
# Distinct from structure colors to avoid confusion
# =============================================================================
sequences:
  short_wave:
    name: "Short Wave"
    hex: "#006d77"
    rgb: [0, 109, 119]
    rgb_norm: [0.0, 0.427, 0.467]

  long_wave:
    name: "Long Wave"
    hex: "#e9c46a"
    rgb: [233, 196, 106]
    rgb_norm: [0.914, 0.769, 0.416]

# =============================================================================
# MOLECULES - Ligands (Orange/Purple palette)
# Used for: Molecule processor, Similarity search, Structure ligands
# =============================================================================
molecules:
  retinal:
    name: "Retinal"
    hex: "#ff7f0e"
    rgb: [255, 127, 14]
    rgb_norm: [1.0, 0.498, 0.055]

  carazolol:
    name: "Carazolol"
    hex: "#9467bd"
    rgb: [148, 103, 189]
    rgb_norm: [0.580, 0.404, 0.741]

  # Similarity scale (for bar charts)
  high_similarity:
    hex: "#9467bd"
  moderate_similarity:
    hex: "#c5b0d5"
  low_similarity:
    hex: "#7f7f7f"

# =============================================================================
# EMBEDDINGS - Same as Sequences (Teal/Gold)
# Embeddings represent sequence data, so use same color scheme
# =============================================================================
embeddings:
  group_a:
    name: "Group A"
    hex: "#006d77"
    rgb_norm: [0.0, 0.427, 0.467]

  group_b:
    name: "Group B"
    hex: "#e9c46a"
    rgb_norm: [0.914, 0.769, 0.416]

  # For same/different type comparison
  same_type:
    hex: "#006d77"
  different_type:
    hex: "#e9c46a"

# =============================================================================
# GRAPHS - Same as Structures (Blue/Red)
# Graphs represent structural data
# =============================================================================
graphs:
  type_i:
    hex: "#1f77b4"
    rgb_norm: [0.122, 0.467, 0.706]

  type_ii:
    hex: "#d62728"
    rgb_norm: [0.839, 0.153, 0.157]

  edges:
    hex: "#7f7f7f"
    rgb_norm: [0.498, 0.498, 0.498]

# =============================================================================
# FUNCTIONAL ELEMENTS
# =============================================================================
functional:
  grn_conserved:
    name: "Conserved positions"
    hex: "#bcbd22"
    rgb_norm: [0.737, 0.741, 0.133]

  binding_pocket:
    hex: "#7f7f7f"
    rgb_norm: [0.498, 0.498, 0.498]

# =============================================================================
# NEUTRAL / GENERAL
# =============================================================================
neutral:
  gray:
    hex: "#7f7f7f"
    rgb_norm: [0.498, 0.498, 0.498]

  light_gray:
    hex: "#c7c7c7"
    rgb_norm: [0.780, 0.780, 0.780]

  dark_gray:
    hex: "#333333"
    rgb_norm: [0.2, 0.2, 0.2]

# =============================================================================
# PYMOL COMMANDS (copy-paste ready)
# =============================================================================
# # Structure colors (protein families)
# set_color type1_blue, [0.122, 0.467, 0.706]
# set_color type1_light, [0.682, 0.780, 0.910]
# set_color type2_red, [0.839, 0.153, 0.157]
# set_color type2_light, [1.0, 0.596, 0.588]
#
# # Ligand colors
# set_color retinal_orange, [1.0, 0.498, 0.055]
# set_color carazolol_purple, [0.580, 0.404, 0.741]
#
# # Always white background
# bg_color white
