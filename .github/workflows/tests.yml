name: Protos Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        exclude:
          # Skip some combinations to reduce CI time
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y mmseqs2
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install mmseqs2
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Set up test data
      run: |
        # Create test data directory structure
        python setup_test_data.py
        
        # Copy reference data to test directory
        python setup_test_data_from_reference.py
    
    - name: Verify test data setup
      run: |
        python -c "
import os
from pathlib import Path

test_data = Path('tests/test-data')
print(f'Test data directory exists: {test_data.exists()}')

# Check key subdirectories
for subdir in ['grn', 'structure', 'sequence']:
    path = test_data / subdir
    print(f'{subdir} directory exists: {path.exists()}')
    if path.exists():
        files = list(path.rglob('*'))[:5]  # Show first 5 files
        print(f'  Sample files: {files}')

# Check specific important files
important_files = [
    'grn/ref/mo_ref.csv',
    'grn/configs/config.json',
    'structure/mmcif/example.cif'
]
for file in important_files:
    path = test_data / file
    print(f'{file} exists: {path.exists()}')
"
    
    - name: Run tests
      run: |
        # Run pytest with coverage
        pytest tests/ -v --tb=short --cov=src/protos --cov-report=xml --cov-report=term-missing
      env:
        # Ensure tests use test-data directory (handled by conftest.py)
        PYTEST_CURRENT_TEST: 1
    
    - name: Run old tests (if applicable)
      run: |
        if [ -f "run_tests.py" ]; then
          python run_tests.py -v
        fi
      shell: bash
    
    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
        pip install -e .
        pip install -r requirements.txt
    
    - name: Check code formatting with Black
      run: |
        black --check src/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/
    
    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports || true  # Don't fail on type errors for now