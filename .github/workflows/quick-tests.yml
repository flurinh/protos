name: Quick Tests

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  quick-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt
        pip install pytest
    
    - name: Cache test data
      uses: actions/cache@v3
      with:
        path: tests/test-data
        key: ${{ runner.os }}-test-data-${{ hashFiles('setup_test_data*.py') }}
        restore-keys: |
          ${{ runner.os }}-test-data-
    
    - name: Set up test data
      run: |
        # Only run if test-data doesn't exist
        if [ ! -d "tests/test-data" ]; then
          python setup_test_data.py
          python setup_test_data_from_reference.py
        else
          echo "Test data already exists (from cache)"
        fi
    
    - name: Run core tests only
      run: |
        # Run only core tests for quick feedback
        pytest tests/test_core/ tests/test_io/ -v --tb=short -x
      env:
        PYTEST_CURRENT_TEST: 1